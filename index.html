    <script>
      // Automatically configure the canonical URL based on location
      const canonicalTag = document.createElement('link');
      canonicalTag.rel = 'canonical';
      canonicalTag.href = window.location.origin;
      document.head.appendChild(canonicalTag);

      // Update OG/Twitter URLs to use actual origin
      document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.origin);
      document.querySelector('meta[property="twitter:url"]').setAttribute('content', window.location.origin);
      document.querySelector('meta[property="og:image"]').setAttribute('content', window.location.origin + '/og-image.png');
      document.querySelector('meta[property="twitter:image"]').setAttribute('content', window.location.origin + '/og-image.png');
    </script>
  </body>
